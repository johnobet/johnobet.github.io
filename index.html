<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="John Obet Olchondra: Android and full stack developer, photojournalist and videographer from Bohol, Philippines." />
    <meta name="theme-color" content="#e8e8e6" />
    <title>John Obet Olchondra | Developer & Visual Storyteller</title>
    <link rel="preload" as="image" href="/me.webp" fetchpriority="high" />
    <script>
      // Set the theme before first paint so there is no light/dark flash.
      (function () {
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#161616';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
